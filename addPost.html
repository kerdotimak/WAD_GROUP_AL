<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Post</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="add-post-page">
  <header>
    <nav>
      <div class="nav">
        <a href="index.html">Home</a>
        <!--<a href="login.html" class="user-icon" title="Profile">👤</a> -->
        <div class="user-menu">
          <a href="login.html" class="user-icon" id="userIcon" title="Profile">👤</a>
          <div class="dropdown" id="userDropdown">
            <p class="dropdown-name">John Doe</p>
            <p class="dropdown-email">john.doe@example.com</p>
            <a href="login.html" class="logout">Logout</a>
          </div>
        </div>  
      </div>
    </nav>
  </header>

  <main>
    <section class="add-post">
      <h2>Add a New Post</h2>
      <article class="add-post-form">
        <form id="addPostForm" action="index.html">
          <label class="add-post-body" for="postBody">Post Body
            <textarea class="add-post-textarea" id="postBody" name="postBody" placeholder="Textarea" required></textarea>
          </label>
          <label class="add-post-image" for="postImage">Choose File
            <input class="add-post-file" type="file" id="postImage" name="postImage">
          </label>

          <button class="submit-button" type="submit">Add Post</button>
        </form>
      </article>
    </section>
  </main>
<script src="dropdown.js"></script>
</body>
</html>
