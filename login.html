<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="add-post-page">
  <header>
    <nav>
      <div class="nav">
        <a href="index.html">Home</a>
        <div class="user-menu">
          <a href="login.html" class="user-icon" id="userIcon" title="Profile">👤</a>
          <div class="dropdown" id="userDropdown">
            <p class="dropdown-name">John Doe</p>
            <p class="dropdown-email">john.doe@example.com</p>
            <a href="login.html" class="logout">Logout</a>
          </div>
        </div>      
      </div>
    </nav>
  </header>


  <main>
    <form class="login-card" id="loginForm" action="index.html">
 
      <div class="card-top">
        <p class="title">Welcome to PostIt</p>
        <a href="#" class="create-account">Create an account</a>
        <p class="or">or</p>
        <p class="prompt">Please log in</p>
      </div>
 
      <div class="card-bottom">
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Log in</button>
        <a href="#" class="forgot-password">Forget password</a>
      </div>
 
    </form>
  </main>
<script src="dropdown.js"></script>
</body>
</html>
